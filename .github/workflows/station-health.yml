name: Station Health Sweep

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call station health endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secret CRON_SECRET" >&2
            exit 1
          fi
          if [ -z "${APP_URL:-}" ]; then
            echo "Missing secret APP_URL (e.g. https://your-app.vercel.app)" >&2
            exit 1
          fi
          BASE="${APP_URL%/}"
          echo "GET station-health → ${BASE}/api/cron/station-health"
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/station-health"
