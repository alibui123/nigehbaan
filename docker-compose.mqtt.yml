# Optional Mosquitto broker for M1 MQTT telemetry (local / in-country VM).
# HTTP-first remains the default on Vercel; use this when exercising the MQTT path.
#
#   docker compose -f docker-compose.mqtt.yml up -d
#   npm install mqtt
#   node scripts/mqtt-station-bridge.mjs
#
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./scripts/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
